# PR Checks — runs on every pull request targeting main.
#
# Pipeline: unit + integration tests → terraform lint → IaC security scan → terraform plan
# The plan output is posted as a PR comment so reviewers see infra changes.
#
# All third-party actions are pinned to full commit SHA to prevent supply-chain attacks.
# To refresh a SHA: gh api repos/{owner}/{repo}/git/ref/tags/{tag} --jq '.object.sha'

name: PR Checks

on:
  workflow_dispatch:
  pull_request:
    # branches: [main]
    types: [opened, synchronize, reopened]

# Cancel any in-flight run for the same PR when a new commit is pushed
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Default: read-only. Individual jobs request only what they need.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  TF_VERSION: "~1.10"
  TFLINT_VERSION: "v0.55.0"

jobs:
  # ── 1. Python unit + integration tests ──────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run pytest
        run: pytest tests/ -v

  # ── 2. Terraform format + lint ──────────────────────────────────────────────
  lint:
    name: Terraform Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: terraform fmt check
        working-directory: terraform
        run: terraform fmt -check -recursive
      - uses: terraform-linters/setup-tflint@v6 
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - name: tflint init
        working-directory: terraform
        run: tflint --init
      - name: tflint
        working-directory: terraform
        run: tflint --recursive

  # ── 3. IaC security scanning ────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7 
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install checkov
        run: pip install "checkov>=3.2,<4"
      - name: Run checkov
        # Suppress accepted findings inline: #checkov:skip=CKV_AWS_XYZ:reason
        run: checkov -d terraform --quiet --compact

  # ── 4. Terraform plan (gated on all prior jobs passing) ─────────────────────
  plan:
    name: Terraform Plan
    needs: [test, lint, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # Required for requesting the JWT
      pull-requests: write # Post plan comment
    env:
      TF_INPUT: "false"
    steps:
      - uses: actions/checkout@v5 

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: pr-plan-${{ github.event.pull_request.number }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Plan
        id: plan
        working-directory: terraform
        # pipefail ensures a non-zero terraform exit code isn't swallowed by tee
        run: |
          set -o pipefail
          terraform plan -no-color 2>&1 | tee ../plan_output.txt
        continue-on-error: true

      - name: Post plan as PR comment
        if: always() && (steps.plan.outcome == 'success' || steps.plan.outcome == 'failure')
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('plan_output.txt', 'utf8');
            const body = raw.length > 60000
              ? raw.slice(0, 60000) + '\n\n_[output truncated — run `make plan` locally for the full diff]_'
              : raw;
            const icon = '${{ steps.plan.outcome }}' === 'success' ? '✅' : '❌';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                `## Terraform Plan ${icon}`,
                '',
                '<details><summary>Expand plan output</summary>',
                '',
                '```hcl',
                body,
                '```',
                '</details>',
                '',
                `_Triggered by @${{ github.actor }} · \`${{ github.head_ref }}\` → \`main\`_`,
              ].join('\n'),
            });

      - name: Fail if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1
